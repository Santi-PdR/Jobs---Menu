# Memoria contenida a proposito. En PCs con poca RAM o archivo de paginacion
# chico, Gradle fallaba en reobfJar con errno=1455 (ERROR_COMMITMENT_LIMIT):
# levantaba el daemon a 3G, tareas en paralelo Y un JVM forkeado para reobf,
# todo a la vez, y la suma superaba el limite de memoria comprometible.
# Con 2G, sin paralelismo y un solo worker, los procesos no se pisan y el mod
# -que es chico- compila de sobra. Si tu equipo tiene RAM holgada podes subir
# jvmargs a -Xmx3G y volver a parallel=true sin problema.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1

