# Memoria MUY contenida a proposito. En este equipo el build moria de dos formas
# por falta de memoria comprometible (RAM + archivo de paginacion): primero el
# fork de reobf con errno=1455, y despues el propio daemon de Gradle crasheaba
# al arrancar pidiendo 2G (JVM crash, hs_err). La descompilacion pesada de
# Minecraft ya quedo cacheada de los intentos anteriores, asi que un build
# normal de este mod -que es minusculo- no necesita mucho heap.
#
#   -Xmx1024m         techo de heap chico; sobra para compilar este mod.
#   -XX:+UseSerialGC  el recolector que menos memoria compromete y menos hilos
#                     crea (G1 reserva bastante mas de entrada).
#   -XX:TieredStopAtLevel=1 y ReservedCodeCacheSize bajos: menos memoria del JIT.
#
# Si tu equipo tiene RAM holgada podes volver a -Xmx3G, quitar estos flags y
# reactivar parallel=true; nada de esto cambia el mod, solo como se compila.
org.gradle.jvmargs=-Xmx1024m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1

