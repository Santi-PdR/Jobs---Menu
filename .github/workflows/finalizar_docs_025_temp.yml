name: Finalizar docs 0.25 temporal

on:
  push:
    branches:
      - arena/01a07700-music-0250
    paths:
      - .github/workflows/finalizar_docs_025_temp.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sincronizar documentos finales
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          p = root / 'KNOWN_ISSUES.md'
          t = p.read_text(encoding='utf-8')
          t = t.replace('# Riesgos y pruebas pendientes — 0.24.0', '# Riesgos y pruebas pendientes — 0.25.0', 1)
          t = t.replace('creación de `jobsmenu-0.24.0.jar`;', 'creación de `jobsmenu-0.25.0.jar`;', 1)
          t = t.replace('Prioridad manual de 0.24.0:', 'Prioridad manual de 0.25.0:', 1)
          old = '''1. Main con HUD ampliado, `NXT`, sesión, volumen y MUTE.\n2. Atajos 1–4 y keypad 1–4 del main.\n3. Pausa con 1–2 / keypad 1–2 y confirmación de que 3 no desconecta.\n4. EditBox/buscadores: escribir números no debe disparar atajos.\n5. Breadcrumb, reloj de sesión y contador de pantallas al navegar entre subpantallas.\n6. Foco `KEY` frente a hover `PTR` en botones, sliders y campos.\n7. Scrollbars nuevas en Mundos, Multiplayer, Mods, Recursos e Idioma.\n8. GUI Scale 2/3/4, ultrawide y ventanas pequeñas.\n9. Movimiento reducido, Bajo consumo, Alto contraste e Interfaz mínima.\n10. PNG 10–17 durante navegación y traslados.'''
          new = '''1. Las tres pistas — Absurdism, REQUIEM y Upon the Hill V2 — deben poder sonar en visitas distintas.\n2. `N` debe hacer crossfade a otra pista y no apilar cambios si se pulsa durante un crossfade.\n3. El crédito y `TRK` del HUD deben seguir a la pista dominante correcta.\n4. `M`, F3+T, Alt+Tab y navegación por subpantallas no deben duplicar instancias.\n5. Entrar a mundo/servidor debe cortar inmediatamente música y ambiente Jobs.\n6. Main con HUD ampliado, `NXT`, sesión, volumen, MUTE y pista actual.\n7. Atajos 1–4 del main y 1–2 de pausa; EditBox no debe dispararlos al escribir.\n8. Breadcrumb, KEY/PTR, controles vanilla/Forge y scrollbars nuevas.\n9. GUI Scale 2/3/4, ultrawide, Movimiento reducido, Bajo consumo, Alto contraste e Interfaz mínima.\n10. PNG 10–17 durante navegación y traslados, sin movimiento interno.'''
          if old not in t:
              raise SystemExit('No se encontro prioridad 0.24 en KNOWN_ISSUES')
          t = t.replace(old, new, 1)
          t = t.replace('- La segunda pista no está empaquetada mientras no exista el OGG autorizado en `music/menu_nueva.ogg`.',
                        '- El catálogo de tres pistas ya está empaquetado. Queda pendiente validar dentro de Minecraft la mezcla percibida, diferencias de loudness y crossfade entre fuentes de distinta frecuencia.', 1)
          t = t.replace('- Reproductor musical ligado a sesión con watchdog de SoundEngine.',
                        '- Reproductor musical ligado a sesión con watchdog de SoundEngine, tres pistas independientes y selección sin repetición inmediata.', 1)
          p.write_text(t, encoding='utf-8')

          p = root / 'docs/DESPLIEGUE.md'
          t = p.read_text(encoding='utf-8')
          t = t.replace('`jobsmenu-0.24.0.jar`', '`jobsmenu-0.25.0.jar`')
          old = '''- HUD principal: NXT, tiempo de visita, MUTE/volumen y chips 1–4/F/M;\n- atajos numéricos del main y 1–2 de pausa, incluido keypad;\n- protección de números mientras se escribe en buscadores/EditBox;\n- breadcrumb, KEY/PTR, tipo y posición de control;\n- controles vanilla/Forge tematizados;\n- scrollbars 0/25/50/75/100 en listas grandes;\n- GUI Scale 4, ultrawide, Movimiento reducido, Bajo consumo e Interfaz mínima;\n- fondos 10–17 durante fade/apagón/transición y overlays globales.'''
          new = '''- catálogo musical: Absurdism, REQUIEM y Upon the Hill V2;\n- `N` debe cambiar a una pista distinta mediante crossfade y el HUD debe actualizar `TRK`;\n- créditos dinámicos, `M`, F3+T, Alt+Tab y hard-stop al entrar en gameplay;\n- HUD principal: NXT, tiempo de visita, MUTE/volumen y chips 1–4/F/M;\n- atajos numéricos del main y 1–2 de pausa, incluido keypad;\n- protección de números mientras se escribe en buscadores/EditBox;\n- breadcrumb, KEY/PTR, tipo y posición de control;\n- controles vanilla/Forge y scrollbars en listas grandes;\n- GUI Scale 4, ultrawide, Movimiento reducido, Bajo consumo e Interfaz mínima;\n- fondos 10–17 durante fade/apagón/transición y overlays globales.'''
          if old not in t:
              raise SystemExit('No se encontro checklist 0.24 en DESPLIEGUE')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Santi.pdr"
          git config user.email "santiagopereiraxd029@gmail.com"
          git add -A
          git commit -m "docs: cerrar riesgos y despliegue de 0.25.0"
          git push origin HEAD:arena/01a07700-music-0250
