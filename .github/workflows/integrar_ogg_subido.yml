name: Integrar OGG subido

on:
  push:
    branches:
      - main
    paths:
      - music/menu_nueva.ogg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobsmenu-integrar-ogg-subido
  cancel-in-progress: false

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar OGG de entrada
        shell: bash
        run: |
          set -euo pipefail
          test -f music/menu_nueva.ogg
          codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 music/menu_nueva.ogg)"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 music/menu_nueva.ogg)"
          test "$codec" = "vorbis"
          awk "BEGIN { exit !($duration > 20) }"

      - name: Normalizar para el menu
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/resources/assets/jobsmenu/sounds/musica
          ffmpeg -hide_banner -loglevel warning -y \
            -i music/menu_nueva.ogg -vn -map_metadata -1 \
            -af 'loudnorm=I=-18:TP=-1.5:LRA=11' \
            -ac 2 -ar 48000 -c:a libvorbis -q:a 5 \
            src/main/resources/assets/jobsmenu/sounds/musica/tema_nuevo.ogg

      - name: Activar segunda pista en recursos y codigo
        shell: python
        run: |
          import json
          from pathlib import Path

          sounds = Path('src/main/resources/assets/jobsmenu/sounds.json')
          data = json.loads(sounds.read_text(encoding='utf-8'))
          data['musica.tema_nuevo'] = {
              'category': 'music',
              'subtitle': 'jobsmenu.subtitulo.musica.tema',
              'sounds': [{'name': 'jobsmenu:musica/tema_nuevo', 'stream': True}],
          }
          sounds.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sonidos = Path('src/main/java/com/santipdr/jobsmenu/client/sound/SonidosNivel.java')
          text = sonidos.read_text(encoding='utf-8')
          marker = 'public static final RegistryObject<SoundEvent> MUSICA_TEMA = registrar("musica.tema");'
          addition = marker + '\n\n    /** Segunda pista opcional, activada por el pipeline de OGG subido. */\n    public static final RegistryObject<SoundEvent> MUSICA_TEMA_NUEVO = registrar("musica.tema_nuevo");'
          if 'MUSICA_TEMA_NUEVO' not in text:
              if marker not in text:
                  raise SystemExit('No se encontro el marcador MUSICA_TEMA')
              text = text.replace(marker, addition)
              sonidos.write_text(text, encoding='utf-8')

          gestor = Path('src/main/java/com/santipdr/jobsmenu/client/sound/GestorMusica.java')
          text = gestor.read_text(encoding='utf-8')
          old = 'return new Pista[] {\n                new Pista("absurdism", SonidosNivel.MUSICA_TEMA, "musica/defecto.ogg")\n        };'
          new = 'return new Pista[] {\n                new Pista("absurdism", SonidosNivel.MUSICA_TEMA, "musica/defecto.ogg"),\n                new Pista("upon_the_hill_v2", SonidosNivel.MUSICA_TEMA_NUEVO, "musica/tema_nuevo.ogg")\n        };'
          if 'upon_the_hill_v2' not in text:
              if old not in text:
                  raise SystemExit('El catalogo musical cambio y requiere revision manual')
              gestor.write_text(text.replace(old, new), encoding='utf-8')

      - name: Verificaciones estaticas
        shell: bash
        run: |
          set -euo pipefail
          python tools/verificar_version.py
          python tools/verificar_fondos.py
          python tools/verificar.py
          python tools/verificar_ui_musica.py

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Forge
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - name: Publicar integracion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jobs Menu Audio Pipeline'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main/resources/assets/jobsmenu/sounds/musica/tema_nuevo.ogg \
                  src/main/resources/assets/jobsmenu/sounds.json \
                  src/main/java/com/santipdr/jobsmenu/client/sound/SonidosNivel.java \
                  src/main/java/com/santipdr/jobsmenu/client/sound/GestorMusica.java
          if git diff --cached --quiet; then
            echo 'La pista ya estaba integrada.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'audio: integrate uploaded lobby theme'
          git push origin HEAD:main
