name: Finalizar checklist 0.25 temporal

on:
  push:
    branches:
      - arena/01a07700-music-0250
    paths:
      - .github/workflows/finalizar_checklist_025_temp.yml

permissions:
  contents: write

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar checklist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/checklist-manual.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace('# Checklist manual de aceptación — 0.24.0', '# Checklist manual de aceptación — 0.25.0', 1)
          t = t.replace('`jobsmenu-0.24.0.jar`', '`jobsmenu-0.25.0.jar`')
          t = t.replace('## Main screen 0.24.0', '## Main screen 0.25.0', 1)
          t = t.replace('## Pausa 0.24.0', '## Pausa 0.25.0', 1)
          t = t.replace('## Instrumentación contextual 0.24.0', '## Instrumentación contextual 0.25.0', 1)
          t = t.replace('## Scrollbars Jobs 0.24.0', '## Scrollbars Jobs 0.25.0', 1)
          old = '''- [ ] Absurdism entra con fade-in limpio.\n- [ ] Main → Options → Mods → Recursos → volver no reinicia ni duplica música.\n- [ ] F3+T y Alt+Tab no crean instancias fantasma.\n- [ ] entrar a gameplay corta música/ambiente desde el primer tick jugable.\n- [ ] salir de mundo/servidor/kick recupera Jobs.'''
          new = '''- [ ] En visitas nuevas pueden iniciar **Absurdism**, **REQUIEM** o **Upon the Hill V2**.\n- [ ] `N` cambia mediante crossfade a una pista distinta de la actual.\n- [ ] Pulsar `N` otra vez durante el crossfade no crea una tercera instancia.\n- [ ] El HUD `TRK` y el crédito visible siguen a la pista dominante real.\n- [ ] REQUIEM muestra `Emmy Z - Forsaken OST`; Upon the Hill V2 muestra `ft. @iCosmicCoffee`; Absurdism no inventa autor.\n- [ ] La rotación automática cambia aproximadamente cada 2–4 minutos y no repite inmediatamente la misma pista.\n- [ ] `M` silencia/restaura el sistema sin cambiar de pista accidentalmente.\n- [ ] Main → Options → Mods → Recursos → volver no reinicia ni duplica música.\n- [ ] F3+T y Alt+Tab no crean instancias fantasma.\n- [ ] entrar a gameplay corta música/ambiente desde el primer tick jugable.\n- [ ] salir de mundo/servidor/kick recupera Jobs.'''
          if old not in t:
              raise SystemExit('No se encontro bloque de sonido anterior')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Santi.pdr"
          git config user.email "santiagopereiraxd029@gmail.com"
          git add -A
          git commit -m "docs: actualizar checklist manual a 0.25.0"
          git push origin HEAD:arena/01a07700-music-0250
