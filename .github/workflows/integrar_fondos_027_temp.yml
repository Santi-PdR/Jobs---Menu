name: Integrar fondos 18-31 temp

on:
  push:
    branches:
      - arena/01a07900-backgrounds-18-31-clean

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar cambios
        run: python3 tools/integrar_fondos_027_temp.py

      - name: Publicar cambios si existen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle gradle.properties CHANGELOG.md README.md docs/FONDOS_18_31.md tools/verificar_fondos.py src/main/java/com/santipdr/jobsmenu/client/scene/Nivel.java src/main/java/com/santipdr/jobsmenu/client/scene/planta/PlantaImagen.java src/main/resources/assets/jobsmenu/lang/es_es.json src/main/resources/assets/jobsmenu/lang/en_us.json
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git commit -m "0.27.0: integrar niveles 18-31"
          git push origin HEAD:arena/01a07900-backgrounds-18-31-clean
