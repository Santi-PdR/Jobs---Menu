name: One-time branch cleanup

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "JobsMenu-Branch-Cleanup",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          list_url = f"https://api.github.com/repos/{repo}/git/matching-refs/heads/"
          request = urllib.request.Request(list_url, headers=headers)
          with urllib.request.urlopen(request) as response:
              refs = json.load(response)

          removed = 0
          for item in refs:
              ref = item["ref"]
              if ref == "refs/heads/main":
                  continue
              branch = ref.removeprefix("refs/heads/")
              encoded = urllib.parse.quote(branch, safe="")
              delete_url = f"https://api.github.com/repos/{repo}/git/refs/heads/{encoded}"
              print(f"Deleting {branch}")
              request = urllib.request.Request(delete_url, headers=headers, method="DELETE")
              with urllib.request.urlopen(request) as response:
                  if response.status != 204:
                      raise RuntimeError(f"Unexpected HTTP {response.status} deleting {branch}")
              removed += 1

          print(f"Deleted {removed} branches; main was preserved.")
          PY
