name: Build Jobs Menu

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jobsmenu-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve mod version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          if [ -z "$VERSION" ]; then
            echo 'No se pudo leer mod_version de gradle.properties' >&2
            exit 1
          fi
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MOD_JAR=jobsmenu-$VERSION.jar" >> "$GITHUB_ENV"
      - name: Verify versioned artifact policy
        run: python3 tools/verificar_version.py
      - name: Verify image backgrounds
        run: python3 tools/verificar_fondos.py
      - name: Python verification
        run: python3 tools/verificar.py
      - name: Verify neutral UI and music session
        run: python3 tools/verificar_ui_musica.py
      - name: Verify multiplayer continuity and docs
        run: python3 tools/verificar_continuidad.py
      - name: Verify hot-path optimization contracts
        run: python3 tools/verificar_optimizacion.py
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Build Forge mod
        run: ./gradlew build --stacktrace --no-daemon
      - name: Prepare versioned JAR
        shell: bash
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo 'No se encontro el JAR principal en build/libs' >&2
            exit 1
          fi
          cp "$JAR" "$MOD_JAR"
          sha256sum "$MOD_JAR"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobsmenu-${{ env.MOD_VERSION }}
          path: ${{ env.MOD_JAR }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove obsolete release JARs
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          keep = os.environ["MOD_JAR"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "JobsMenu-CI",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          release_url = f"https://api.github.com/repos/{repo}/releases/tags/dev-latest"
          try:
              request = urllib.request.Request(release_url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("dev-latest aun no existe; no hay assets viejos que limpiar")
                  raise SystemExit(0)
              raise

          for asset in release.get("assets", []):
              name = asset.get("name", "")
              if not (name.startswith("jobsmenu-") and name.endswith(".jar")):
                  continue
              if name == keep:
                  continue
              asset_id = asset["id"]
              print(f"Eliminando asset obsoleto: {name}")
              delete_url = f"https://api.github.com/repos/{repo}/releases/assets/{asset_id}"
              request = urllib.request.Request(delete_url, headers=headers, method="DELETE")
              with urllib.request.urlopen(request) as response:
                  if response.status != 204:
                      raise RuntimeError(f"GitHub devolvio HTTP {response.status} al borrar {name}")
          PY
      - name: Publish rolling development release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: dev-latest
          name: Jobs Menu v${{ env.MOD_VERSION }} - Latest Dev Build
          body: Build de desarrollo v${{ env.MOD_VERSION }} generado automaticamente desde el ultimo commit que paso verificacion y compilacion con Java 17.
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: ${{ env.MOD_JAR }}
