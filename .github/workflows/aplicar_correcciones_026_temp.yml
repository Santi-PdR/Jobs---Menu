    branches:
      - arena/01a07800-fix-ux-0251

permissions:
  contents: write

jobs:
  aplicar:
    if: ${{ github.event.head_commit.message != '0.26.0: corregir interfaces, audio y deposito' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a07800-fix-ux-0251
