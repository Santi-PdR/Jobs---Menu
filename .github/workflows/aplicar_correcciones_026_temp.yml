          text = text.replace('    private EditBox busqueda;\n\n    public PantallaMundosJobs(Screen anterior) {\n        super(anterior);\n    }', '    private final Screen anteriorJobs;\n    private EditBox busqueda;\n\n    public PantallaMundosJobs(Screen anterior) {\n        super(anterior);\n        this.anteriorJobs = anterior;\n    }')
          old = '        if (keyCode == org.lwjgl.glfw.GLFW.GLFW_KEY_ESCAPE && this.busqueda != null\n                && this.busqueda.isFocused() && !this.busqueda.getValue().isEmpty()) {\n            this.busqueda.setValue("");\n            return true;\n        }\n        return super.keyPressed(keyCode, scanCode, modifiers);\n    }\n'
          new = '        if (keyCode == org.lwjgl.glfw.GLFW.GLFW_KEY_ESCAPE) {\n            volverAlMenu();\n            return true;\n        }\n        return super.keyPressed(keyCode, scanCode, modifiers);\n    }\n\n    @Override\n    public void onClose() { volverAlMenu(); }\n\n    private void volverAlMenu() {\n        if (this.minecraft == null) return;\n        this.minecraft.setScreen(this.anteriorJobs != null ? this.anteriorJobs : new PantallaNivel());\n    }\n'
          if old not in text: raise SystemExit('No se encontro keyPressed de Mundos')
          write(p, text.replace(old, new, 1))

          # Multiplayer: ESC y Cancel directos.
          p = 'src/main/java/com/santipdr/jobsmenu/client/screen/PantallaMultijugadorJobs.java'
          text = read(p)
          text = text.replace('    private static final String SERVIDOR_IP = "JobsDosh.exaroton.me:56477";\n\n    private Button realSelect, realDirect, realAdd, realEdit, realDelete, realRefresh, realCancel;', '    private static final String SERVIDOR_IP = "JobsDosh.exaroton.me:56477";\n\n    private final Screen anteriorJobs;\n    private Button realSelect, realDirect, realAdd, realEdit, realDelete, realRefresh, realCancel;')
          text = text.replace('    public PantallaMultijugadorJobs(Screen anterior) {\n        super(anterior);\n    }', '    public PantallaMultijugadorJobs(Screen anterior) {\n        super(anterior);\n        this.anteriorJobs = anterior;\n    }')
          old = '        BotonExpediente b = new BotonExpediente(x, y, w, 21,\n                Component.translatable(clave), tipo, () -> pulsar(real));\n'
          new = '        Runnable accion = "gui.cancel".equals(clave) ? this::volverAlMenu : () -> pulsar(real);\n        BotonExpediente b = new BotonExpediente(x, y, w, 21,\n                Component.translatable(clave), tipo, accion);\n'
