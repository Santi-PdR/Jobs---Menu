          text = text.replace(old, new, 1)
          old = '    @Override\n    public boolean keyPressed(int keyCode, int scanCode, int modifiers) {\n        if (keyCode == GLFW.GLFW_KEY_F5 && this.realRefresh != null && this.realRefresh.active) {\n            this.realRefresh.onPress();\n            return true;\n        }\n        return super.keyPressed(keyCode, scanCode, modifiers);\n    }\n}\n'
          new = '    @Override\n    public boolean keyPressed(int keyCode, int scanCode, int modifiers) {\n        if (keyCode == GLFW.GLFW_KEY_ESCAPE) {\n            volverAlMenu();\n            return true;\n        }\n        if (keyCode == GLFW.GLFW_KEY_F5 && this.realRefresh != null && this.realRefresh.active) {\n            this.realRefresh.onPress();\n            return true;\n        }\n        return super.keyPressed(keyCode, scanCode, modifiers);\n    }\n\n    @Override\n    public void onClose() { volverAlMenu(); }\n\n    private void volverAlMenu() {\n        if (this.minecraft == null) return;\n        this.minecraft.setScreen(this.anteriorJobs != null ? this.anteriorJobs : new PantallaNivel());\n    }\n}\n'
          if old not in text: raise SystemExit('No se encontro final Multiplayer')
          write(p, text.replace(old, new, 1))

          # Nivel 1: backup y renderer nuevo.
          backup = ROOT / 'backups/nivel1/Nave_0.25.0.java.txt'
          backup.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(ROOT / 'src/main/java/com/santipdr/jobsmenu/client/scene/planta/Nave.java', backup)
