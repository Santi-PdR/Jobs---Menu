          old = '        int key = evento.getKeyCode();\n        int indice = -1;\n'
          new = '        int key = evento.getKeyCode();\n        if (pantalla instanceof PantallaNivel && key == GLFW.GLFW_KEY_N) {\n            if (GestorMusica.adelantarPista()) evento.setCanceled(true);\n            return;\n        }\n\n        int indice = -1;\n'
          if old not in text:
              raise SystemExit('No se encontro el punto de insercion del atajo N')
          text = text.replace(old, new, 1)
          write(p, text)
          replace_once('src/main/java/com/santipdr/jobsmenu/client/ui/CapaProfesionalJobs.java', 'case "MAIN" -> new String[]{"1-4", "F", "M", "TAB", "ENTER"};', 'case "MAIN" -> new String[]{"1-4", "F", "M", "N", "TAB", "ENTER"};')

          # Mods: conservar geometria nativa de Forge.
          mods = '''package com.santipdr.jobsmenu.client.screen;\n\nimport com.santipdr.jobsmenu.client.ui.ChromeExpediente;\nimport com.santipdr.jobsmenu.client.ui.ListasExpediente;\nimport com.santipdr.jobsmenu.client.ui.Paleta;\n\nimport net.minecraft.client.gui.GuiGraphics;\nimport net.minecraft.client.gui.components.EditBox;\nimport net.minecraft.client.gui.screens.Screen;\nimport net.minecraft.network.chat.Component;\nimport net.minecraftforge.client.gui.ModListScreen;\n\nimport org.lwjgl.glfw.GLFW;\n\n/** Forge Mods con el registro real intacto. */\npublic final class PantallaModsJobs extends ModListScreen {\n    private static final int PANEL_X = 12;\n    private static final int PANEL_Y = 8;\n    private final Screen anteriorJobs;\n    private EditBox busqueda;\n\n    public PantallaModsJobs(Screen anterior) {\n        super(anterior);\n        this.anteriorJobs = anterior;\n    }\n\n    @Override\n    public void init() {\n        super.init();\n        ListasExpediente.estilizar(this);\n        for (var child : this.children()) {\n            if (child instanceof EditBox campo) {\n                this.busqueda = campo;\n                campo.setTextColor(Paleta.ARCHIVO_TEXTO);\n                campo.setTextColorUneditable(Paleta.ARCHIVO_TEXTO_TENUE);\n                campo.setBordered(false);\n            }\n        }\n    }\n\n    @Override\n    public boolean keyPressed(int keyCode, int scanCode, int modifiers) {\n        if (Screen.hasControlDown() && keyCode == GLFW.GLFW_KEY_F && this.busqueda != null) {\n            this.setFocused(this.busqueda);\n            this.busqueda.setFocused(true);\n            return true;\n        }\n        if (keyCode == GLFW.GLFW_KEY_ESCAPE) {\n            volverAlMenu();\n            return true;\n        }\n        return super.keyPressed(keyCode, scanCode, modifiers);\n    }\n\n    @Override\n    public void onClose() { volverAlMenu(); }\n\n    private void volverAlMenu() {\n        if (this.minecraft == null) return;\n        this.minecraft.setScreen(this.anteriorJobs != null ? this.anteriorJobs : new PantallaNivel());\n    }\n\n    @Override\n    public void renderBackground(GuiGraphics g) {\n        ChromeExpediente.fondo(g, this.width, this.height);\n        ChromeExpediente.panelArchivo(g, PANEL_X, PANEL_Y, this.width - PANEL_X * 2, this.height - PANEL_Y * 2);\n    }\n\n    @Override\n    public void renderDirtBackground(GuiGraphics g) { renderBackground(g); }\n\n    @Override\n    public void render(GuiGraphics g, int mouseX, int mouseY, float partialTick) {\n        renderBackground(g);\n        super.render(g, mouseX, mouseY, partialTick);\n        int panelW = this.width - PANEL_X * 2;\n        g.fill(PANEL_X + 3, PANEL_Y + 1, PANEL_X + panelW - 3, PANEL_Y + 23, Paleta.VANO);\n        Component titulo = this.title == null ? Component.literal("Mods") : this.title;\n        int tw = this.font.width(titulo);\n        g.drawString(this.font, titulo, Math.max(PANEL_X + 10, (this.width - tw) / 2), PANEL_Y + 7, Paleta.ARCHIVO_TEXTO, false);\n        g.fill(PANEL_X + 18, PANEL_Y + 21, this.width - PANEL_X - 18, PANEL_Y + 22, Paleta.conAlfa(Paleta.ARCHIVO_ACENTO, 0.26F));\n        ListasExpediente.renderarBarras(this, g);\n        int railY = this.height - 24;\n        if (railY > PANEL_Y + 30) {\n            g.fill(PANEL_X + 16, railY, this.width - PANEL_X - 16, railY + 1, Paleta.conAlfa(Paleta.ARCHIVO_ACENTO, 0.18F));\n            if (this.width >= 420) g.drawString(this.font, "CTRL+F  //  ESC", PANEL_X + 18, railY + 5, Paleta.conAlfa(Paleta.ARCHIVO_TEXTO_TENUE, 0.52F), false);\n        }\n    }\n}\n'''
          write('src/main/java/com/santipdr/jobsmenu/client/screen/PantallaModsJobs.java', mods)

          # Resource Packs: preservar las dos listas nativas.
          packs = '''package com.santipdr.jobsmenu.client.screen;\n\nimport com.santipdr.jobsmenu.client.ui.ChromeExpediente;\nimport com.santipdr.jobsmenu.client.ui.ListasExpediente;\nimport com.santipdr.jobsmenu.client.ui.Paleta;\n\nimport net.minecraft.client.gui.GuiGraphics;\nimport net.minecraft.client.gui.screens.packs.PackSelectionScreen;\nimport net.minecraft.network.chat.Component;\nimport net.minecraft.server.packs.repository.PackRepository;\n\nimport java.nio.file.Path;\nimport java.util.function.Consumer;\n\n/** Selector vanilla de paquetes con fondo Jobs y geometria nativa. */\npublic final class PantallaPaquetesJobs extends PackSelectionScreen {\n    private static final int PANEL_X = 12;\n    private static final int PANEL_Y = 8;\n\n    public PantallaPaquetesJobs(PackRepository repo, Consumer<PackRepository> callback, Path directorio, Component titulo) {\n        super(repo, callback, directorio, titulo);\n    }\n\n    @Override\n    protected void init() {\n        super.init();\n        ListasExpediente.estilizar(this);\n    }\n\n    @Override\n    public void renderBackground(GuiGraphics g) {\n        ChromeExpediente.fondo(g, this.width, this.height);\n        ChromeExpediente.panelArchivo(g, PANEL_X, PANEL_Y, this.width - PANEL_X * 2, this.height - PANEL_Y * 2);\n    }\n\n    @Override\n    public void renderDirtBackground(GuiGraphics g) { renderBackground(g); }\n\n    @Override\n    public void render(GuiGraphics g, int mouseX, int mouseY, float partialTick) {\n        renderBackground(g);\n        super.render(g, mouseX, mouseY, partialTick);\n        ListasExpediente.renderarBarras(this, g);\n        int railY = this.height - 24;\n        if (railY > PANEL_Y + 30) {\n            g.fill(PANEL_X + 16, railY, this.width - PANEL_X - 16, railY + 1, Paleta.conAlfa(Paleta.ARCHIVO_ACENTO, 0.16F));\n            String sello = "JOBS / RESOURCE ARCHIVE";\n            int sw = this.font.width(sello);\n            if (sw + 48 < this.width) g.drawString(this.font, sello, this.width - PANEL_X - sw - 18, railY + 5, Paleta.conAlfa(Paleta.ARCHIVO_TEXTO_TENUE, 0.46F), false);\n        }\n    }\n}\n'''
          write('src/main/java/com/santipdr/jobsmenu/client/screen/PantallaPaquetesJobs.java', packs)

          # Mundos: ESC directo al padre Jobs.
          p = 'src/main/java/com/santipdr/jobsmenu/client/screen/PantallaMundosJobs.java'
