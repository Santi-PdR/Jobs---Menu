          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'No se encontro patron en {path}: {old[:100]!r}')
              text = text.replace(old, new, 1)
              write(path, text)

          # Main: elimina SHIFT CONTROL y el rotulo JOBS / LEVEL duplicado.
          p = 'src/main/java/com/santipdr/jobsmenu/client/screen/PantallaNivel.java'
          text = read(p)
          text = text.replace('import com.santipdr.jobsmenu.client.ui.HudPrincipalJobs;\n', '')
          text = text.replace('        HudPrincipalJobs.dibujar(grafico, this.width, this.height, this.estadoFrame);\n', '')
          patron = re.compile(r'\n        if \(this\.width - \(x \+ this\.anchoHoja\) > 150\) \{.*?\n        \}\n    \}\n\n    private void estadoInstalacion', re.S)
          text, n = patron.subn('\n    }\n\n    private void estadoInstalacion', text, count=1)
          if n != 1:
              raise SystemExit('No se pudo retirar el bloque JOBS / LEVEL del main')
          write(p, text)
          hud = ROOT / 'src/main/java/com/santipdr/jobsmenu/client/ui/HudPrincipalJobs.java'
          if hud.exists():
              hud.unlink()

