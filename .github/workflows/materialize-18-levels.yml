name: Materialize 18 Levels

on:
  push:
    branches:
      - arena/20260830-fix-backgrounds-15-17-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/20260830-fix-backgrounds-15-17-clean
          fetch-depth: 0

      - name: Apply migration
        run: |
          python3 tools/ajustar_dimensiones_18.py
          python3 tools/migrar_niveles_18.py

      - name: Commit materialized sources and PNGs
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Migration already materialized."
            exit 0
          fi
          git config user.name "Santi.pdr"
          git config user.email "santiagopereiraxd029@gmail.com"
          git add src/main tools/verificar.py CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No tracked migration changes."
            exit 0
          fi
          git commit -m "feat: materialize levels 15-17 and repair image backgrounds"
          git push origin HEAD:arena/20260830-fix-backgrounds-15-17-clean
