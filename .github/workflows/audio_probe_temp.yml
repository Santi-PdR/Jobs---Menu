name: Audio probe temporal

on:
  push:
    branches:
      - arena/01a07600-ui-0240
    paths:
      - .github/workflows/audio_probe_temp.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identificar OGG existente
        shell: bash
        run: |
          set -euo pipefail
          f='music/REQUIEM-Forsaken-OST.ogg'
          sha256sum "$f"
          python3 - <<'PY'
          from pathlib import Path
          import struct

          p = Path('music/REQUIEM-Forsaken-OST.ogg')
          data = p.read_bytes()
          if not data.startswith(b'OggS'):
              raise SystemExit('No es un contenedor Ogg')

          if b'\x01vorbis' in data[:65536]:
              pos = data.index(b'\x01vorbis')
              codec = 'vorbis'
              rate = int.from_bytes(data[pos + 12:pos + 16], 'little')
          elif b'OpusHead' in data[:65536]:
              codec = 'opus'
              rate = 48000
          else:
              codec = 'desconocido'
              rate = 0

          off = 0
          last = 0
          pages = 0
          while off + 27 <= len(data):
              if data[off:off+4] != b'OggS':
                  nxt = data.find(b'OggS', off + 1)
                  if nxt < 0:
                      break
                  off = nxt
              segs = data[off + 26]
              if off + 27 + segs > len(data):
                  break
              granule = struct.unpack_from('<Q', data, off + 6)[0]
              if granule != 0xffffffffffffffff:
                  last = granule
              body = sum(data[off + 27:off + 27 + segs])
              off += 27 + segs + body
              pages += 1

          print(f'codec={codec}')
          print(f'sample_rate={rate}')
          print(f'bytes={len(data)}')
          print(f'pages={pages}')
          print(f'last_granule={last}')
          if rate:
              print(f'duration_estimate={last / rate:.6f}')
          PY
