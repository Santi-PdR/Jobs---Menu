name: Integrar pista autorizada

on:
  push:
    branches:
      - main
    paths:
      - tools/integrar_pista.trigger

concurrency:
  group: jobsmenu-integrar-pista
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar descargador
        run: python -m pip install --disable-pip-version-check --no-cache-dir --upgrade yt-dlp

      - name: Preparar integrador temporal
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''''''
          target = Path('tools/integrar_pista_autorizada.py')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          target.chmod(0o755)
          PY

      - name: Obtener metadatos y audio autorizado
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.youtube.com/watch?v=t9KaSaGEwvI'
          python -m yt_dlp \
            --no-playlist \
            --no-warnings \
            --dump-single-json \
            "$URL" > /tmp/jobsmenu-track.json

          python -m yt_dlp \
            --no-playlist \
            --retries 10 \
            --fragment-retries 10 \
            --retry-sleep 2 \
            --format 'bestaudio[ext=m4a]/bestaudio/best' \
            --output '/tmp/jobsmenu-source.%(ext)s' \
            "$URL"

          SOURCE="$(find /tmp -maxdepth 1 -type f -name 'jobsmenu-source.*' | head -n 1)"
          test -n "$SOURCE"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Convertir a OGG Vorbis normalizado
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel warning -y \
            -i "$SOURCE" -vn -map_metadata -1 \
            -af 'loudnorm=I=-18:TP=-1.5:LRA=11' \
            -ac 1 -ar 44100 -c:a libvorbis -q:a 5 \
            /tmp/jobsmenu-autorizada.ogg

          codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/jobsmenu-autorizada.ogg)"
          channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 /tmp/jobsmenu-autorizada.ogg)"
          rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 /tmp/jobsmenu-autorizada.ogg)"
          test "$codec" = 'vorbis'
          test "$channels" = '1'
          test "$rate" = '44100'
          test "$(stat -c '%s' /tmp/jobsmenu-autorizada.ogg)" -gt 100000

      - name: Aplicar pase 0.18.0
        run: python tools/integrar_pista_autorizada.py /tmp/jobsmenu-track.json /tmp/jobsmenu-autorizada.ogg

      - name: Verificar recursos y contratos
        shell: bash
        run: |
          set -euo pipefail
          python tools/verificar_version.py
          python tools/verificar_fondos.py
          python tools/verificar.py
          python tools/verificar_ui_musica.py

      - name: Compilar con Java 17 antes de publicar cambios
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Forge
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - name: Publicar integración atómica
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Santi-PdR Audio Integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'v0.18.0: integrate authorized soundtrack and quality pass' \
            -m 'Add the authorized t9KaSaGEwvI track as normalized streaming Ogg Vorbis, expand the session player to two-track shuffle/crossfade with dynamic credits and manual skip, harden verification, and synchronize current documentation.'
          git push origin HEAD:main
