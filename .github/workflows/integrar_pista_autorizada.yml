name: Integrar pista autorizada

on:
  push:
    branches:
      - main
    paths:
      - tools/integrar_pista.trigger

permissions:
  contents: write

concurrency:
  group: jobsmenu-integrar-pista
  cancel-in-progress: false

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconstruir integrador temporal
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.integrar_chunks/part-* | base64 --decode > tools/integrar_pista_autorizada.py
          chmod +x tools/integrar_pista_autorizada.py
          python -m py_compile tools/integrar_pista_autorizada.py

      - name: Obtener metadatos y audio autorizado
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import subprocess
          import sys
          import urllib.parse
          import urllib.request

          VIDEO_ID = "t9KaSaGEwvI"
          USER_AGENT = (
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          )
          PIPED = [
              "https://pipedapi.kavin.rocks",
              "https://pipedapi.leptons.xyz",
              "https://pipedapi.nosebs.ru",
              "https://pipedapi-libre.kavin.rocks",
              "https://piped-api.privacy.com.de",
              "https://pipedapi.adminforge.de",
              "https://api.piped.yt",
              "https://pipedapi.drgns.space",
              "https://pipedapi.owo.si",
              "https://pipedapi.ducks.party",
              "https://piped-api.codespace.cz",
              "https://pipedapi.reallyaweso.me",
              "https://api.piped.private.coffee",
              "https://pipedapi.darkness.services",
              "https://pipedapi.orangenet.cc",
          ]
          INVIDIOUS = [
              "https://inv.nadeko.net",
              "https://invidious.nerdvpn.de",
              "https://yt.chocolatemoo53.com",
              "https://invidious.tiekoetter.com",
          ]

          def get_json(url: str) -> dict:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "application/json",
                      "Accept-Language": "en-US,en;q=0.8",
                  },
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}")
                  return json.load(response)

          def probe_audio(path: pathlib.Path) -> bool:
              if not path.is_file() or path.stat().st_size < 100_000:
                  return False
              result = subprocess.run(
                  [
                      "ffprobe", "-v", "error", "-select_streams", "a:0",
                      "-show_entries", "stream=codec_name",
                      "-of", "default=nw=1:nk=1", str(path),
                  ],
                  text=True,
                  capture_output=True,
                  check=False,
                  timeout=30,
              )
              return result.returncode == 0 and bool(result.stdout.strip())

          def download(url: str, target: pathlib.Path, referer: str) -> bool:
              target.unlink(missing_ok=True)
              command = [
                  "curl", "--location", "--fail", "--silent", "--show-error",
                  "--retry", "3", "--retry-all-errors", "--connect-timeout", "20",
                  "--max-time", "300", "--user-agent", USER_AGENT,
                  "--header", f"Referer: {referer}",
                  "--output", str(target), url,
              ]
              result = subprocess.run(command, check=False)
              return result.returncode == 0 and probe_audio(target)

          def stream_score(item: dict) -> tuple[int, int, int]:
              mime = str(item.get("mimeType") or item.get("format") or "").lower()
              codec = str(item.get("codec") or "").lower()
              bitrate = int(item.get("bitrate") or 0)
              preferred = 2 if "audio/mp4" in mime or "m4a" in mime else 1
              modern = 1 if ("opus" in codec or "mp4a" in codec) else 0
              return preferred, modern, bitrate

          errors: list[str] = []
          source: pathlib.Path | None = None
          metadata: dict | None = None

          for base in PIPED:
              try:
                  data = get_json(f"{base}/streams/{VIDEO_ID}")
                  streams = [
                      item for item in data.get("audioStreams", [])
                      if isinstance(item, dict) and item.get("url")
                  ]
                  streams.sort(key=stream_score, reverse=True)
                  if not streams:
                      raise RuntimeError("sin audioStreams")
                  for index, item in enumerate(streams[:6]):
                      raw_url = str(item["url"])
                      url = urllib.parse.urljoin(base + "/", raw_url)
                      mime = str(item.get("mimeType") or item.get("format") or "").lower()
                      suffix = ".m4a" if ("mp4" in mime or "m4a" in mime) else ".webm"
                      candidate = pathlib.Path(f"/tmp/jobsmenu-source-piped-{index}{suffix}")
                      if download(url, candidate, base + "/"):
                          source = candidate
                          metadata = {
                              "id": VIDEO_ID,
                              "title": data.get("title") or "Pista autorizada",
                              "uploader": data.get("uploader") or data.get("uploaderName")
                                          or "Autor autorizado",
                              "duration": data.get("duration") or 0,
                              "webpage_url": f"https://www.youtube.com/watch?v={VIDEO_ID}",
                              "transport": "piped",
                              "transport_instance": base,
                          }
                          print(f"Piped OK: {base} -> {candidate}")
                          break
                  if source:
                      break
                  raise RuntimeError("los flujos devueltos no se pudieron descargar/probar")
              except Exception as exc:
                  errors.append(f"Piped {base}: {exc}")
                  print(errors[-1], file=sys.stderr)

          if source is None:
              for base in INVIDIOUS:
                  try:
                      data = get_json(f"{base}/api/v1/videos/{VIDEO_ID}")
                      formats = [
                          item for item in data.get("adaptiveFormats", [])
                          if isinstance(item, dict)
                          and str(item.get("type") or "").lower().startswith("audio/")
                          and item.get("url")
                      ]
                      formats.sort(
                          key=lambda item: int(item.get("bitrate") or 0),
                          reverse=True,
                      )
                      if not formats:
                          raise RuntimeError("sin adaptiveFormats de audio")
                      for index, item in enumerate(formats[:6]):
                          mime = str(item.get("type") or "").lower()
                          suffix = ".m4a" if "mp4" in mime else ".webm"
                          candidate = pathlib.Path(
                              f"/tmp/jobsmenu-source-invidious-{index}{suffix}"
                          )
                          if download(str(item["url"]), candidate, base + "/"):
                              source = candidate
                              metadata = {
                                  "id": VIDEO_ID,
                                  "title": data.get("title") or "Pista autorizada",
                                  "uploader": data.get("author") or "Autor autorizado",
                                  "duration": data.get("lengthSeconds") or 0,
                                  "webpage_url": f"https://www.youtube.com/watch?v={VIDEO_ID}",
                                  "transport": "invidious",
                                  "transport_instance": base,
                              }
                              print(f"Invidious OK: {base} -> {candidate}")
                              break
                      if source:
                          break
                      raise RuntimeError("los flujos devueltos no se pudieron descargar/probar")
                  except Exception as exc:
                      errors.append(f"Invidious {base}: {exc}")
                      print(errors[-1], file=sys.stderr)

          if source is None or metadata is None:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit("Ninguna instancia pública entregó un flujo de audio válido.")

          pathlib.Path("/tmp/jobsmenu-track.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SOURCE={source}\n")
          PY

      - name: Convertir a OGG Vorbis normalizado
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel warning -y \
            -i "$SOURCE" -vn -map_metadata -1 \
            -af 'loudnorm=I=-18:TP=-1.5:LRA=11' \
            -ac 1 -ar 44100 -c:a libvorbis -q:a 5 \
            /tmp/jobsmenu-autorizada.ogg

          codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/jobsmenu-autorizada.ogg)"
          channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 /tmp/jobsmenu-autorizada.ogg)"
          rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 /tmp/jobsmenu-autorizada.ogg)"
          test "$codec" = 'vorbis'
          test "$channels" = '1'
          test "$rate" = '44100'
          test "$(stat -c '%s' /tmp/jobsmenu-autorizada.ogg)" -gt 100000

      - name: Aplicar pase 0.18.0
        run: python tools/integrar_pista_autorizada.py /tmp/jobsmenu-track.json /tmp/jobsmenu-autorizada.ogg

      - name: Verificar recursos y contratos
        shell: bash
        run: |
          set -euo pipefail
          python tools/verificar_version.py
          python tools/verificar_fondos.py
          python tools/verificar.py
          python tools/verificar_ui_musica.py

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Forge
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - name: Publicar integracion atomica
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/.integrar_chunks
          git config user.name 'Santi-PdR Audio Integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'v0.18.0: integrate authorized soundtrack and quality pass' \
            -m 'Add the authorized t9KaSaGEwvI track as normalized streaming Ogg Vorbis, expand the session player to two-track shuffle/crossfade with dynamic credits and manual skip, harden verification, and synchronize current documentation.'
          git push origin HEAD:main
