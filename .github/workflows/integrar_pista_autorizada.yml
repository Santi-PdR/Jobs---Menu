name: Integrar pista autorizada

on:
  push:
    branches:
      - main
    paths:
      - tools/integrar_pista.trigger

permissions:
  contents: write

concurrency:
  group: jobsmenu-integrar-pista
  cancel-in-progress: false

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconstruir integrador temporal
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.integrar_chunks/part-* | base64 --decode > tools/integrar_pista_autorizada.py
          chmod +x tools/integrar_pista_autorizada.py
          python -m py_compile tools/integrar_pista_autorizada.py

      - name: Obtener metadatos y audio autorizado
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import subprocess
          import sys
          import urllib.request

          VIDEO_ID = "t9KaSaGEwvI"
          SOURCE_URL = f"https://www.youtube.com/watch?v={VIDEO_ID}"
          USER_AGENT = (
              "JobsMenu-AudioIntegrator/0.18 "
              "(+https://github.com/Santi-PdR/Jobs---Menu)"
          )
          DIRECTORY = "https://instances.cobalt.best/api/instances.json"
          FALLBACKS = [
              "https://cobalt-api.kwiatekmiki.com",
              "https://cobalt-api.meowing.de",
              "https://capi.3kh0.net",
              "https://cobalt-backend.canine.tools",
              "https://bergung-api.hoffnungfuerdiezukunft.net",
              "https://apicobalt.mgytr.top",
          ]

          def request_json(
              url: str,
              *,
              method: str = "GET",
              payload: dict | None = None,
              timeout: int = 25,
          ) -> object:
              body = None
              headers = {
                  "User-Agent": USER_AGENT,
                  "Accept": "application/json",
              }
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  url,
                  data=body,
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  if response.status < 200 or response.status >= 300:
                      raise RuntimeError(f"HTTP {response.status}")
                  return json.load(response)

          def normalize_api(item: dict) -> str | None:
              api = str(item.get("api") or "").strip().rstrip("/")
              if not api:
                  return None
              if api.startswith(("http://", "https://")):
                  return api
              protocol = str(item.get("protocol") or "https").strip() or "https"
              return f"{protocol}://{api}"

          def youtube_available(item: dict) -> bool:
              services = item.get("services")
              if not isinstance(services, dict):
                  return True
              value = services.get("youtube")
              return value is True or value == "true"

          def instance_allowed(item: dict) -> bool:
              online = item.get("online")
              if isinstance(online, dict):
                  online = online.get("api")
              if online is False:
                  return False
              info = item.get("info")
              if isinstance(info, dict) and info.get("auth") is True:
                  return False
              return youtube_available(item)

          def probe_audio(path: pathlib.Path) -> bool:
              if not path.is_file() or path.stat().st_size < 100_000:
                  return False
              result = subprocess.run(
                  [
                      "ffprobe", "-v", "error", "-select_streams", "a:0",
                      "-show_entries", "stream=codec_name",
                      "-of", "default=nw=1:nk=1", str(path),
                  ],
                  text=True,
                  capture_output=True,
                  check=False,
                  timeout=30,
              )
              return result.returncode == 0 and bool(result.stdout.strip())

          def download(url: str, target: pathlib.Path, referer: str) -> bool:
              target.unlink(missing_ok=True)
              command = [
                  "curl", "--location", "--fail", "--silent", "--show-error",
                  "--retry", "3", "--retry-all-errors",
                  "--connect-timeout", "20", "--max-time", "420",
                  "--user-agent", USER_AGENT,
                  "--header", f"Referer: {referer}/",
                  "--output", str(target), url,
              ]
              result = subprocess.run(command, check=False)
              return result.returncode == 0 and probe_audio(target)

          candidates: list[str] = []
          try:
              directory = request_json(DIRECTORY, timeout=30)
              if isinstance(directory, list):
                  ranked = sorted(
                      (item for item in directory if isinstance(item, dict)),
                      key=lambda item: int(item.get("score") or 0),
                      reverse=True,
                  )
                  for item in ranked:
                      if not instance_allowed(item):
                          continue
                      api = normalize_api(item)
                      if api and api not in candidates:
                          candidates.append(api)
          except Exception as exc:
              print(f"Directorio Cobalt no disponible: {exc}", file=sys.stderr)

          for api in FALLBACKS:
              if api not in candidates:
                  candidates.append(api)

          payloads = [
              {
                  "url": SOURCE_URL,
                  "downloadMode": "audio",
                  "audioFormat": "best",
                  "filenameStyle": "basic",
                  "alwaysProxy": True,
                  "disableMetadata": False,
              },
              {
                  "url": SOURCE_URL,
                  "downloadMode": "audio",
                  "audioFormat": "ogg",
                  "audioBitrate": "192",
                  "filenameStyle": "basic",
                  "alwaysProxy": True,
                  "disableMetadata": False,
              },
          ]

          errors: list[str] = []
          source: pathlib.Path | None = None
          selected_api: str | None = None
          response_metadata: dict = {}

          for api in candidates[:24]:
              for variant, payload in enumerate(payloads):
                  try:
                      response = request_json(
                          api + "/",
                          method="POST",
                          payload=payload,
                          timeout=90,
                      )
                      if not isinstance(response, dict):
                          raise RuntimeError("respuesta no JSON-objeto")
                      status = str(response.get("status") or "")
                      if status == "error":
                          error = response.get("error")
                          if isinstance(error, dict):
                              code = error.get("code")
                          else:
                              code = response.get("code") or error
                          raise RuntimeError(f"cobalt error: {code}")
                      media_url = response.get("url")
                      if status not in {"tunnel", "redirect"} or not media_url:
                          raise RuntimeError(f"estado no descargable: {status}")
                      candidate = pathlib.Path(
                          f"/tmp/jobsmenu-source-cobalt-{variant}.bin"
                      )
                      if not download(str(media_url), candidate, api):
                          raise RuntimeError("el túnel no produjo audio válido")
                      source = candidate
                      selected_api = api
                      response_metadata = response
                      print(f"Cobalt OK: {api} -> {candidate}")
                      break
                  except Exception as exc:
                      message = f"Cobalt {api} variante {variant}: {exc}"
                      errors.append(message)
                      print(message, file=sys.stderr)
              if source:
                  break

          if source is None or selected_api is None:
              print("\n".join(errors[-50:]), file=sys.stderr)
              raise SystemExit("Ninguna instancia Cobalt entregó audio válido.")

          metadata = {
              "id": VIDEO_ID,
              "title": response_metadata.get("filename") or "Pista autorizada",
              "uploader": "Autor autorizado",
              "duration": 0,
              "webpage_url": SOURCE_URL,
              "transport": "cobalt",
              "transport_instance": selected_api,
          }
          pathlib.Path("/tmp/jobsmenu-track.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SOURCE={source}\n")
          PY

      - name: Convertir a OGG Vorbis normalizado
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel warning -y \
            -i "$SOURCE" -vn -map_metadata -1 \
            -af 'loudnorm=I=-18:TP=-1.5:LRA=11' \
            -ac 1 -ar 44100 -c:a libvorbis -q:a 5 \
            /tmp/jobsmenu-autorizada.ogg

          codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/jobsmenu-autorizada.ogg)"
          channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 /tmp/jobsmenu-autorizada.ogg)"
          rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 /tmp/jobsmenu-autorizada.ogg)"
          test "$codec" = 'vorbis'
          test "$channels" = '1'
          test "$rate" = '44100'
          test "$(stat -c '%s' /tmp/jobsmenu-autorizada.ogg)" -gt 100000

      - name: Aplicar pase 0.18.0
        run: python tools/integrar_pista_autorizada.py /tmp/jobsmenu-track.json /tmp/jobsmenu-autorizada.ogg

      - name: Verificar recursos y contratos
        shell: bash
        run: |
          set -euo pipefail
          python tools/verificar_version.py
          python tools/verificar_fondos.py
          python tools/verificar.py
          python tools/verificar_ui_musica.py

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Forge
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - name: Publicar integracion atomica
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/.integrar_chunks
          git config user.name 'Santi-PdR Audio Integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'v0.18.0: integrate authorized soundtrack and quality pass' \
            -m 'Add the authorized t9KaSaGEwvI track as normalized streaming Ogg Vorbis, expand the session player to two-track shuffle/crossfade with dynamic credits and manual skip, harden verification, and synchronize current documentation.'
          git push origin HEAD:main
