name: Integrar pista autorizada

on:
  push:
    branches:
      - main
    paths:
      - tools/integrar_pista.trigger

concurrency:
  group: jobsmenu-integrar-pista
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar descargador y proveedor PO Token
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --upgrade 'yt-dlp[default]' bgutil-ytdlp-pot-provider
          docker run --name bgutil-provider -d --init -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4416/ping >/dev/null 2>&1 || curl --silent --fail http://127.0.0.1:4416/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker ps --filter name=bgutil-provider

