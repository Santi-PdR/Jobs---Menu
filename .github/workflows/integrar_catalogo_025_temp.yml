name: Integrar catalogo musical 0.25 temporal

on:
  push:
    branches:
      - arena/01a07700-music-0250
    paths:
      - .github/workflows/integrar_catalogo_025_temp.yml

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrar tres pistas y mejoras
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil, re

          ROOT = Path('.')
          JAVA = ROOT / 'src/main/java/com/santipdr/jobsmenu'
          RES = ROOT / 'src/main/resources/assets/jobsmenu'

          def must(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'No se encontro marcador: {label}')
              return text.replace(old, new, 1)

          # Recursos OGG: se reutilizan exactamente los binarios subidos/autorizados.
          src_req = ROOT / 'music/REQUIEM-Forsaken-OST.ogg'
          src_hill = ROOT / 'music/upon_the_hill_v2_q4.ogg'
          if not src_req.is_file() or not src_hill.is_file():
              raise SystemExit('Falta REQUIEM o Upon the Hill en music/.')
          dst = RES / 'sounds/musica'
          dst.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(src_req, dst / 'requiem.ogg')
          shutil.copyfile(src_hill, dst / 'upon_the_hill_v2.ogg')

          # sounds.json: tres eventos independientes y streaming para OGG largos.
          sounds_path = RES / 'sounds.json'
          sounds = json.loads(sounds_path.read_text(encoding='utf-8'))
          sounds['musica.tema'] = {
              'category': 'music',
              'subtitle': 'jobsmenu.subtitulo.musica.tema',
              'sounds': [{'name': 'jobsmenu:musica/defecto', 'stream': True}],
          }
          sounds['musica.requiem'] = {
              'category': 'music',
              'subtitle': 'jobsmenu.subtitulo.musica.requiem',
              'sounds': [{'name': 'jobsmenu:musica/requiem', 'stream': True}],
          }
          sounds['musica.upon_hill'] = {
              'category': 'music',
              'subtitle': 'jobsmenu.subtitulo.musica.upon_hill',
              'sounds': [{'name': 'jobsmenu:musica/upon_the_hill_v2', 'stream': True}],
          }
          sounds_path.write_text(json.dumps(sounds, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Subtitulos de eventos musicales.
          for lang, req, hill in (
              ('es_es.json', 'Música: REQUIEM', 'Música: Upon the Hill V2'),
              ('en_us.json', 'Music: REQUIEM', 'Music: Upon the Hill V2'),
          ):
              p = RES / 'lang' / lang
              data = json.loads(p.read_text(encoding='utf-8'))
              data['jobsmenu.subtitulo.musica.requiem'] = req
              data['jobsmenu.subtitulo.musica.upon_hill'] = hill
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Registro Forge de las tres pistas.
          p = JAVA / 'client/sound/SonidosNivel.java'
          text = p.read_text(encoding='utf-8')
          old = '''    /**\n     * Tema del menu.\n     *\n     * En sounds.json este evento apunta a dos archivos: musica/tema, que es la\n     * ranura de reemplazo para una pista con licencia propia, y musica/defecto,\n     * que es la pieza original que viene con el mod. Ver GestorMusica.\n     */\n    public static final RegistryObject<SoundEvent> MUSICA_TEMA = registrar("musica.tema");'''
          new = '''    /** Absurdism, pista base historica del menu. */\n    public static final RegistryObject<SoundEvent> MUSICA_TEMA = registrar("musica.tema");\n\n    /** REQUIEM - Emmy Z / Forsaken OST. */\n    public static final RegistryObject<SoundEvent> MUSICA_REQUIEM = registrar("musica.requiem");\n\n    /** Upon the Hill V2, pista adicional del catalogo. */\n    public static final RegistryObject<SoundEvent> MUSICA_UPON_HILL = registrar("musica.upon_hill");'''
          text = must(text, old, new, 'SonidosNivel musica')
          p.write_text(text, encoding='utf-8')

          # Gestor musical: catalogo real, shuffle sin repeticion, skip manual y creditos dinamicos.
          p = JAVA / 'client/sound/GestorMusica.java'
          text = p.read_text(encoding='utf-8')
          text = text.replace('private static final int CAMBIO_MIN_TICKS = 4 * 60 * 20;',
                              'private static final int CAMBIO_MIN_TICKS = 2 * 60 * 20;')
          text = text.replace('private static final int CAMBIO_VARIACION_TICKS = 3 * 60 * 20;',
                              'private static final int CAMBIO_VARIACION_TICKS = 2 * 60 * 20;')
          text = must(text,
              'private record Pista(String id, RegistryObject<SoundEvent> evento, String recurso) {\n    }',
              'private record Pista(String id, RegistryObject<SoundEvent> evento, String recurso,\n                         String titulo, String autor) {\n    }',
              'record Pista')
          old_catalog = '''    /**\n     * El evento legado musica.tema apunta actualmente al OGG que el proyecto\n     * identifica como Absurdism. La infraestructura acepta mas entradas sin\n     * volver a tocar el algoritmo de mezcla.\n     */\n    private static Pista[] catalogo() {\n        return new Pista[] {\n                new Pista("absurdism", SonidosNivel.MUSICA_TEMA, "musica/defecto.ogg")\n        };\n    }'''
          new_catalog = '''    /** Catalogo real de la sesion. Cada pista conserva identidad y credito. */\n    private static Pista[] catalogo() {\n        return new Pista[] {\n                new Pista("absurdism", SonidosNivel.MUSICA_TEMA, "musica/defecto.ogg",\n                        "Absurdism", ""),\n                new Pista("requiem", SonidosNivel.MUSICA_REQUIEM, "musica/requiem.ogg",\n                        "REQUIEM", "Emmy Z - Forsaken OST"),\n                new Pista("upon_the_hill_v2", SonidosNivel.MUSICA_UPON_HILL,\n                        "musica/upon_the_hill_v2.ogg", "Upon the Hill V2",\n                        "ft. @iCosmicCoffee")\n        };\n    }'''
          text = must(text, old_catalog, new_catalog, 'catalogo tres pistas')
          text = text.replace('int siguiente = (indiceActual + 1) % pistas.length;',
                              'int siguiente = siguienteIndice(pistas);', 1)

          marker = '''    public static void nuevaVisita() {\n        detenerInstancias(true);\n        reintento = 0;\n        marcador = -1;\n        ticksSesion = 0;'''
          replacement = '''    private static int siguienteIndice(Pista[] pistas) {\n        if (pistas.length <= 1) return 0;\n        int salto = 1 + (int) (Math.random() * (pistas.length - 1));\n        return (indiceActual + salto) % pistas.length;\n    }\n\n    /** Salta manualmente a otra pista sin repetir la actual. */\n    public static boolean adelantarPista() {\n        Pista[] pistas = catalogo();\n        if (pistas.length <= 1 || !SesionMenu.activa() || !ConfigTurno.musicaMenu()\n                || !viva(principal) || viva(entrante)) return false;\n        int siguiente = siguienteIndice(pistas);\n        entrante = crear(pistas[siguiente], 0.0F, 1.0F, 0);\n        principal.gananciaObjetivo = 0.0F;\n        Minecraft.getInstance().getSoundManager().play(entrante);\n        indiceActual = siguiente;\n        ticksSesion = 0;\n        proximoCambio = CAMBIO_MIN_TICKS\n                + (int) (Math.random() * CAMBIO_VARIACION_TICKS);\n        JobsMenu.LOG.info("[jobsmenu] Cambio manual hacia pista: {}.", pistas[siguiente].id());\n        return true;\n    }\n\n    public static void nuevaVisita() {\n        detenerInstancias(true);\n        reintento = 0;\n        marcador = -1;\n        Pista[] pistas = catalogo();\n        indiceActual = pistas.length <= 1 ? 0 : (int) (Math.random() * pistas.length);\n        ticksSesion = 0;'''
          text = must(text, marker, replacement, 'shuffle nueva visita')

          marker = '''    public static float creditoAlfa() {\n        GestorMusica m = viva(entrante) && entrante.gananciaActual > 0.55F ? entrante : principal;'''
          replacement = '''    private static GestorMusica pistaDominante() {\n        if (viva(entrante) && entrante.gananciaActual > (principal == null ? 0.0F : principal.gananciaActual)) {\n            return entrante;\n        }\n        return principal;\n    }\n\n    private static Pista datosPista(String id) {\n        if (id == null) return null;\n        for (Pista pista : catalogo()) if (pista.id().equals(id)) return pista;\n        return null;\n    }\n\n    public static String tituloPistaActual() {\n        GestorMusica m = pistaDominante();\n        Pista pista = m == null ? null : datosPista(m.idPista);\n        return pista == null ? "-" : pista.titulo();\n    }\n\n    public static String autorPistaActual() {\n        GestorMusica m = pistaDominante();\n        Pista pista = m == null ? null : datosPista(m.idPista);\n        return pista == null ? "" : pista.autor();\n    }\n\n    public static int cantidadPistas() {\n        return catalogo().length;\n    }\n\n    public static float creditoAlfa() {\n        GestorMusica m = pistaDominante();'''
          text = must(text, marker, replacement, 'creditos dinamicos')
          p.write_text(text, encoding='utf-8')

          # Main: credito segun pista y N para siguiente tema.
          p = JAVA / 'client/screen/PantallaNivel.java'
          text = p.read_text(encoding='utf-8')
          old_credit = '''        Component titulo = Component.translatable("jobsmenu.credito.titulo");\n        Component autor = Component.translatable("jobsmenu.credito.autor");'''
          new_credit = '''        Component titulo = Component.literal(GestorMusica.tituloPistaActual());\n        Component autor = Component.literal(GestorMusica.autorPistaActual());'''
          text = must(text, old_credit, new_credit, 'credito PantallaNivel')
          old_key = '''        if (codigo == GLFW.GLFW_KEY_F && ConfigTurno.rotarNiveles()) {\n            RotacionNiveles.adelantar();\n            MezclaAudio.gesto(SonidosNivel.UI_ALTERNAR, 0.60F);\n            return true;\n        }'''
          new_key = '''        if (codigo == GLFW.GLFW_KEY_N) {\n            if (GestorMusica.adelantarPista()) {\n                MezclaAudio.gesto(SonidosNivel.UI_ALTERNAR, 0.52F);\n            } else {\n                MezclaAudio.gesto(SonidosNivel.UI_NEGADO, 0.32F);\n            }\n            return true;\n        }\n        if (codigo == GLFW.GLFW_KEY_F && ConfigTurno.rotarNiveles()) {\n            RotacionNiveles.adelantar();\n            MezclaAudio.gesto(SonidosNivel.UI_ALTERNAR, 0.60F);\n            return true;\n        }'''
          text = must(text, old_key, new_key, 'tecla N')
          p.write_text(text, encoding='utf-8')

          # HUD: nombre de pista actual + pista total sin aumentar ruido visual.
          p = JAVA / 'client/ui/HudPrincipalJobs.java'
          text = p.read_text(encoding='utf-8')
          text = must(text,
              'import com.santipdr.jobsmenu.client.scene.RotacionNiveles;\n',
              'import com.santipdr.jobsmenu.client.scene.RotacionNiveles;\nimport com.santipdr.jobsmenu.client.sound.GestorMusica;\n',
              'import GestorMusica HUD')
          text = text.replace('int h = 124;', 'int h = 139;', 1)
          old = '''        int by = y + 95;\n        dibujarTecla(g, font, x + 9, by, "1-4", luz, contraste);'''
          new = '''        String pista = "TRK " + GestorMusica.tituloPistaActual() + "  N>NEXT";\n        g.drawString(font, ChromeExpediente.ajustar(font, pista, panelW - 18),\n                x + 9, y + 95,\n                Paleta.conAlfa(Paleta.papelAviso(), limitar(0.31F * luz * contraste)), false);\n\n        int by = y + 108;\n        dibujarTecla(g, font, x + 9, by, "1-4", luz, contraste);'''
          text = must(text, old, new, 'HUD pista')
          p.write_text(text, encoding='utf-8')

          # Verificador: el contrato deja de ser una ranura futura y pasa a ser tres pistas reales.
          p = ROOT / 'tools/verificar_ui_musica.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace('"""Contratos vigentes de 0.19.0: UI neutra, robustez, sesion musical y ranura OGG."""',
                              '"""Contratos vigentes: UI neutra, robustez y catalogo musical de tres pistas."""')
          old_required = '''        'new Pista("absurdism", SonidosNivel.MUSICA_TEMA, "musica/defecto.ogg")',\n        "SUAVIZADO_SUBIDA", "SUAVIZADO_BAJADA", "SUAVIZADO_CROSSFADE",'''
          new_required = '''        'new Pista("absurdism", SonidosNivel.MUSICA_TEMA, "musica/defecto.ogg",',\n        'new Pista("requiem", SonidosNivel.MUSICA_REQUIEM, "musica/requiem.ogg",',\n        'new Pista("upon_the_hill_v2", SonidosNivel.MUSICA_UPON_HILL,',\n        "adelantarPista()", "siguienteIndice(Pista[] pistas)", "tituloPistaActual()",\n        "SUAVIZADO_SUBIDA", "SUAVIZADO_BAJADA", "SUAVIZADO_CROSSFADE",'''
          text = must(text, old_required, new_required, 'verificador catalogo')
          old_docs = '''    for token in ("upon_the_hill_v2", "music/menu_nueva.ogg", "integrar_ogg_subido.yml"):\n        if token not in music_doc:\n            fail(f"docs/musica.md perdio el contrato de la segunda pista: {token}")'''
          new_docs = '''    for token in ("Absurdism", "REQUIEM", "Upon the Hill V2", "music/upon_the_hill_v2_q4.ogg"):\n        if token not in music_doc:\n            fail(f"docs/musica.md perdio el catalogo musical: {token}")\n\n    for event_name, resource in (("musica.requiem", "jobsmenu:musica/requiem"),\n                                 ("musica.upon_hill", "jobsmenu:musica/upon_the_hill_v2")):\n        event = sounds.get(event_name)\n        if not isinstance(event, dict):\n            fail(f"sounds.json no contiene {event_name}.")\n        names = [item if isinstance(item, str) else item.get("name") for item in event.get("sounds", [])]\n        if resource not in names:\n            fail(f"{event_name} no apunta a {resource}.")\n\n    for filename in ("defecto.ogg", "requiem.ogg", "upon_the_hill_v2.ogg"):\n        ogg = RES / "sounds/musica" / filename\n        if not ogg.is_file() or ogg.stat().st_size < 64:\n            fail(f"Falta pista empaquetada: {filename}")'''
          text = must(text, old_docs, new_docs, 'docs verifier')
          pattern = re.compile(r'\ndef verify_upload_slot\(\) -> None:.*?\n\ndef main\(\) -> int:', re.S)
          repl = '''\n\ndef verify_audio_sources() -> None:\n    for path in (ROOT / "music/REQUIEM-Forsaken-OST.ogg", ROOT / "music/upon_the_hill_v2_q4.ogg"):\n        if not path.is_file() or path.stat().st_size < 64:\n            fail(f"Falta fuente OGG autorizada: {path.relative_to(ROOT)}")\n    legacy = (\n        ROOT / ".github/workflows/integrar_pista_autorizada.yml",\n        ROOT / "tools/cobalt_transport.py",\n        ROOT / "tools/integrar_pista.trigger",\n    )\n    for path in legacy:\n        if path.exists():\n            fail(f"Sigue presente infraestructura de audio obsoleta: {path.relative_to(ROOT)}")\n\n\ndef main() -> int:'''
          text, count = pattern.subn(repl, text, count=1)
          if count != 1:
              raise SystemExit('No se pudo reemplazar verify_upload_slot')
          text = text.replace('verify_upload_slot()', 'verify_audio_sources()')
          text = text.replace('print("Ranura de OGG subido: OK")', 'print("Catalogo musical de tres pistas: OK")')
          text = text.replace('print(f"ERROR 0.19.0: {exc}"', 'print(f"ERROR catalogo musical: {exc}"')
          p.write_text(text, encoding='utf-8')

          # Version 0.25.0.
          p = ROOT / 'gradle.properties'
          text = p.read_text(encoding='utf-8')
          if 'mod_version=0.24.0' not in text:
              raise SystemExit('gradle.properties no esta en 0.24.0')
          p.write_text(text.replace('mod_version=0.24.0', 'mod_version=0.25.0', 1), encoding='utf-8')

          # README: nueva entrega y fin de la ranura futura.
          p = ROOT / 'README.md'
          text = p.read_text(encoding='utf-8')
          text = text.replace('| Versión | **0.24.0** |', '| Versión | **0.25.0** |', 1)
          text = text.replace('| Artefacto | **`jobsmenu-0.24.0.jar`** |', '| Artefacto | **`jobsmenu-0.25.0.jar`** |', 1)
          anchor = '## 0.24.0 · Navegación contextual y controles de tercera generación\n'
          section = '''## 0.25.0 · Catálogo musical real y control de sesión\n\n- Catálogo real de **3 pistas**: Absurdism, REQUIEM y Upon the Hill V2.\n- REQUIEM y Upon the Hill se empaquetan desde los OGG autorizados ya presentes en `music/`; el build no descarga audio externo.\n- Cada pista tiene evento propio, `stream: true`, identidad independiente y crédito contextual.\n- El crédito del main ya no muestra REQUIEM mientras suena otra canción.\n- La visita comienza en una pista aleatoria y los cambios evitan repetir inmediatamente la pista actual.\n- Rotación musical aproximada de 2–4 minutos con crossfade.\n- Tecla **N** en el main para pasar manualmente a otra pista; durante un crossfade se rechaza el doble salto.\n- El HUD muestra la pista dominante actual y la ayuda `N>NEXT`.\n- Mute, ducking, recarga de recursos, continuidad por subpantallas y hard-stop en gameplay siguen vigentes.\n\n'''
          text = must(text, anchor, section + anchor, 'README seccion 0.25')
          old_future = '''## Música futura\n\nLa integración de una segunda pista sigue preparada mediante una sola subida a:\n\n`music/menu_nueva.ogg`\n\nEl workflow `Integrar OGG subido` valida Vorbis, normaliza loudness/true peak, genera el recurso final, registra el tema, ejecuta verificaciones y compila con Java 17. Si algo falla, no publica la integración.'''
          new_future = '''## Música\n\nEl catálogo empaquetado es **Absurdism + REQUIEM + Upon the Hill V2**. Las fuentes autorizadas de REQUIEM y Upon the Hill se conservan en `music/`; los recursos de runtime viven en `assets/jobsmenu/sounds/musica/`. No existe descarga de audio durante build o ejecución.'''
          text = must(text, old_future, new_future, 'README musica')
          text = text.replace('publicación de **`jobsmenu-0.24.0.jar`**', 'publicación de **`jobsmenu-0.25.0.jar`**', 1)
          text = text.replace('- [`docs/AUDITORIA_0.24.0_84_MEJORAS.md`](docs/AUDITORIA_0.24.0_84_MEJORAS.md): pase transversal actual.',
                              '- [`docs/AUDITORIA_AUDIO_0.25.0.md`](docs/AUDITORIA_AUDIO_0.25.0.md): catálogo musical y mejoras de sesión.\n- [`docs/AUDITORIA_0.24.0_84_MEJORAS.md`](docs/AUDITORIA_0.24.0_84_MEJORAS.md): pase transversal anterior.', 1)
          p.write_text(text, encoding='utf-8')

          # CONTEXTO: version y contrato musical vigente.
          p = ROOT / 'CONTEXTO.md'
          text = p.read_text(encoding='utf-8')
          text = text.replace('| Version actual | **0.24.0** |', '| Version actual | **0.25.0** |', 1)
          text = text.replace('| Artefacto esperado | **`jobsmenu-0.24.0.jar`** |', '| Artefacto esperado | **`jobsmenu-0.25.0.jar`** |', 1)
          text = text.replace('## 3. Estado 0.24.0\n\n', '## 3. Estado 0.25.0\n\n0.25.0 suma un catalogo musical real de tres pistas y conserva como base todo el pase visual 0.24.0.\n\n### Musica de sesion 0.25\n\n- Absurdism, REQUIEM y Upon the Hill V2 son pistas independientes;\n- cada una tiene SoundEvent y OGG de runtime propio;\n- OGG largos usan streaming;\n- inicio aleatorio por visita y siguiente pista sin repeticion inmediata;\n- crossfade automatico cada 2-4 minutos;\n- `N` solicita siguiente pista desde el main;\n- credito y HUD siguen a la pista dominante durante crossfade;\n- `M` conserva mute y gameplay conserva hard-stop.\n\n### Base visual 0.24\n\n', 1)
          old_music = '''Pista incluida actual:\n\n- **Absurdism** -> `assets/jobsmenu/sounds/musica/defecto.ogg`.\n\nSegunda pista preparada:\n\n- entrada: `music/menu_nueva.ogg`;\n- id interno: `upon_the_hill_v2`;\n- salida: `assets/jobsmenu/sounds/musica/tema_nuevo.ogg`;\n- workflow: `.github/workflows/integrar_ogg_subido.yml`.'''
          new_music = '''Catalogo vigente:\n\n- **Absurdism** -> `assets/jobsmenu/sounds/musica/defecto.ogg`;\n- **REQUIEM** -> `assets/jobsmenu/sounds/musica/requiem.ogg`; fuente `music/REQUIEM-Forsaken-OST.ogg`;\n- **Upon the Hill V2** -> `assets/jobsmenu/sounds/musica/upon_the_hill_v2.ogg`; fuente `music/upon_the_hill_v2_q4.ogg`.'''
          text = must(text, old_music, new_music, 'CONTEXTO musica')
          text = text.replace('- crossfade cuando haya 2+ pistas;', '- crossfade automatico entre las 3 pistas y skip manual con `N`;', 1)
          text = text.replace('- artefacto `jobsmenu-0.24.0.jar`;', '- artefacto `jobsmenu-0.25.0.jar`;', 1)
          p.write_text(text, encoding='utf-8')

          # CHANGELOG: entrada nueva sin borrar historia.
          p = ROOT / 'CHANGELOG.md'
          text = p.read_text(encoding='utf-8')
          entry = '''## 0.25.0 — Catálogo musical real — 2026-09-03\n\n### Audio / UX\n\n- Integra Absurdism, REQUIEM y Upon the Hill V2 como tres pistas independientes.\n- REQUIEM y Upon the Hill usan los OGG autorizados presentes en `music/`; no hay descarga externa.\n- Los tres eventos musicales usan streaming para evitar cargar pistas largas completas en memoria.\n- Inicio aleatorio por visita y selección siguiente sin repetición inmediata.\n- Crossfade automático cada 2–4 minutos y salto manual con `N`.\n- Créditos dinámicos: el título/autor corresponden a la pista dominante real.\n- HUD principal muestra pista actual y ayuda de cambio.\n- Se mantienen ducking, mute, watchdog, recarga, continuidad de sesión y hard-stop en gameplay.\n\n### Entrega\n\n- Versión: **0.25.0**.\n- Artefacto: **`jobsmenu-0.25.0.jar`**.\n- Auditoría: `docs/AUDITORIA_AUDIO_0.25.0.md`.\n\n'''
          text = must(text, '# Registro de cambios\n\n', '# Registro de cambios\n\n' + entry, 'CHANGELOG 0.25')
          p.write_text(text, encoding='utf-8')

          # docs/musica.md reemplazado por el contrato ya implementado.
          (ROOT / 'docs/musica.md').write_text('''# Música — Jobs Menu 0.25.0\n\n## Catálogo empaquetado\n\n1. **Absurdism** — `assets/jobsmenu/sounds/musica/defecto.ogg` — evento `musica.tema`.\n2. **REQUIEM** — `assets/jobsmenu/sounds/musica/requiem.ogg` — evento `musica.requiem`. Fuente autorizada: `music/REQUIEM-Forsaken-OST.ogg`. Crédito: **Emmy Z — Forsaken OST**.\n3. **Upon the Hill V2** — `assets/jobsmenu/sounds/musica/upon_the_hill_v2.ogg` — evento `musica.upon_hill`. Fuente autorizada: `music/upon_the_hill_v2_q4.ogg`. El archivo recibido identifica `ft. @iCosmicCoffee`.\n\nLos tres recursos de música usan `stream: true` en `sounds.json`. El build no descarga canciones ni depende de servicios externos.\n\n## Sesión\n\n- La música pertenece a `SesionMenu`, no a una Screen.\n- Una visita empieza en una pista aleatoria.\n- La siguiente pista se elige entre las otras dos, evitando repetir inmediatamente.\n- El cambio automático ocurre aproximadamente cada 2–4 minutos y usa crossfade.\n- `N` en el main solicita un cambio manual; no encadena otro mientras ya existe un crossfade.\n- `M` mantiene el mute global Jobs.\n- Options, Mods, Mundos, Multiplayer y Recursos no reinician la pista.\n- Transiciones, Suspensión y presencia aplican ducking.\n- F3+T reconstruye de forma defensiva la sesión de audio.\n- Entrar a mundo/servidor aplica hard-stop inmediato.\n\n## Créditos\n\n`PantallaNivel` consulta la pista dominante real durante un crossfade. Por eso REQUIEM no puede aparecer como crédito mientras suena Absurdism o Upon the Hill. Absurdism conserva su nombre sin atribución inventada; REQUIEM muestra `Emmy Z - Forsaken OST`; Upon the Hill V2 muestra la mención `ft. @iCosmicCoffee` recibida con el archivo.\n\n## Prueba manual\n\n1. Abrir Jobs varias veces y confirmar que el inicio no está fijado siempre a la misma pista.\n2. Pulsar `N` y comprobar crossfade a otra canción.\n3. Pulsar `N` repetidamente durante el crossfade: no debe crear varias instancias.\n4. Comprobar que el HUD y el crédito cambian al tema dominante.\n5. Navegar por subpantallas: la música no reinicia.\n6. Probar `M`, F3+T y Alt+Tab.\n7. Entrar a un mundo/servidor: ningún audio Jobs debe sobrevivir.\n''', encoding='utf-8')

          # Fuente musical: ya no hay ranura pendiente.
          (ROOT / 'music/LEEME.txt').write_text('''JOBS MENU - FUENTES DE MUSICA\n\nEste directorio conserva los OGG que el proyecto ya tiene autorizados para empaquetar.\nNo es una carpeta de runtime de Minecraft.\n\nCatalogo actual:\n- Absurdism: el recurso historico ya vive en src/main/resources/assets/jobsmenu/sounds/musica/defecto.ogg\n- REQUIEM: music/REQUIEM-Forsaken-OST.ogg -> sounds/musica/requiem.ogg\n- Upon the Hill V2: music/upon_the_hill_v2_q4.ogg -> sounds/musica/upon_the_hill_v2.ogg\n\nReglas:\n1. no descargar audio de terceros durante build;\n2. no sustituir una pista por otra bajo el mismo nombre;\n3. cada tema debe tener SoundEvent propio;\n4. los OGG largos deben usar stream:true;\n5. mantener hard-stop al entrar en gameplay;\n6. actualizar docs y verificadores si cambia el catalogo.\n''', encoding='utf-8')

          # Checklist vigente.
          p = ROOT / 'docs/checklist-manual.md'
          text = p.read_text(encoding='utf-8')
          anchor = '## Audio y recarga\n'
          if anchor in text and 'Upon the Hill V2' not in text:
              block = '''## Audio y recarga\n\n- [ ] En visitas nuevas pueden iniciar Absurdism, REQUIEM o Upon the Hill V2.\n- [ ] `N` hace crossfade a una pista distinta sin repetir inmediatamente.\n- [ ] Un segundo `N` durante crossfade no crea otra instancia.\n- [ ] HUD y crédito muestran la pista dominante correcta.\n- [ ] REQUIEM muestra `Emmy Z - Forsaken OST`.\n- [ ] Upon the Hill V2 muestra la mención recibida `ft. @iCosmicCoffee`.\n'''
              text = text.replace(anchor, block, 1)
          p.write_text(text, encoding='utf-8')

          # Auditoria dedicada.
          (ROOT / 'docs/AUDITORIA_AUDIO_0.25.0.md').write_text('''# Auditoría de audio 0.25.0\n\n## Resultado\n\nEl catálogo deja de ser una ranura futura y pasa a tres pistas reales e independientes: **Absurdism**, **REQUIEM** y **Upon the Hill V2**.\n\n## Mejoras implementadas\n\n1. Tres SoundEvents independientes.\n2. Tres OGG de runtime independientes.\n3. REQUIEM conserva su fuente original en `music/`.\n4. Upon the Hill conserva su fuente original en `music/`.\n5. No se renombra una canción como si fuera otra.\n6. `stream:true` en las tres pistas.\n7. Inicio aleatorio por visita.\n8. No repetición inmediata al elegir siguiente pista.\n9. Intervalo automático reducido a 2–4 minutos.\n10. Crossfade conserva dos instancias como máximo.\n11. `N` permite siguiente pista desde el main.\n12. `N` se bloquea mientras ya hay crossfade.\n13. Feedback sonoro positivo/negado para el salto manual.\n14. Crédito usa la pista dominante real.\n15. REQUIEM ya no queda hardcodeado como crédito global.\n16. REQUIEM conserva `Emmy Z - Forsaken OST`.\n17. Upon the Hill conserva la mención `ft. @iCosmicCoffee` recibida con el archivo.\n18. Absurdism no recibe una autoría inventada.\n19. HUD muestra la pista actual.\n20. HUD anuncia `N>NEXT`.\n21. Mute sigue separado de la selección de pista.\n22. Ducking de transición se conserva.\n23. Ducking de Suspensión se conserva.\n24. Ducking de presencia se conserva.\n25. Watchdog de instancia fantasma se conserva.\n26. Recarga de recursos reconstruye audio.\n27. Navegar por subpantallas no reinicia canción.\n28. Gameplay mantiene hard-stop.\n29. `sounds.json` queda verificable por evento/recurso.\n30. El verificador exige los tres OGG empaquetados.\n31. El verificador exige las dos fuentes OGG nuevas.\n32. Documentación ya no menciona una segunda pista pendiente.\n33. No existe descarga de audio en build.\n34. Los PNG 10–17 no se modifican en este pase.\n\n## Prueba pendiente\n\nCI puede certificar estructura, recursos y Forge build, pero la mezcla subjetiva, loudness percibido y transición audible entre las tres canciones deben comprobarse dentro de Minecraft.\n''', encoding='utf-8')

