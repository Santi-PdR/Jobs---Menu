name: Corregir contrato audio 0.25 temporal

on:
  push:
    branches:
      - arena/01a07700-music-0250
    paths:
      - .github/workflows/fix_audio_contract_temp.yml

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar contrato musical
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          p = root / 'tools/verificar.py'
          text = p.read_text(encoding='utf-8')

          old_header = '''# Cuantas piezas de audio tiene la identidad sonora completa:\n#   8 de interfaz (ui/) + 30 camas (10 niveles x ambiente/caracter/actividad)\n#   + 31 eventos de recinto (eventos/) + 3 de transicion electrica (nivel/)\n#   + 1 de la figura + 1 de musica = 74.\n# La cuenta se mantiene derivada: si sounds.json cambia de verdad, este\n# numero se actualiza a mano (y el fallo de abajo lo recuerda).\nPIEZAS_ESPERADAS = 74'''
          new_header = '''# Cuantas piezas de audio tiene la identidad sonora completa:\n#   8 de interfaz (ui/) + 30 camas (10 niveles x ambiente/caracter/actividad)\n#   + 31 eventos de recinto (eventos/) + 3 de transicion electrica (nivel/)\n#   + 1 de la figura + 3 pistas musicales = 76.\n# La cuenta se mantiene derivada: si sounds.json cambia de verdad, este\n# numero se actualiza a mano (y el fallo de abajo lo recuerda).\nPIEZAS_ESPERADAS = 76'''
          if old_header not in text:
              raise SystemExit('No se encontro cabecera PIEZAS_ESPERADAS antigua')
          text = text.replace(old_header, new_header, 1)

          old_audio = '''                canales = datos_ogg[cabecera + 11]\n                frecuencia = int.from_bytes(datos_ogg[cabecera + 12:cabecera + 16], "little")\n                if canales != 1:\n                    fallo(f"{rel} tiene {canales} canales; el contrato del mod exige mono.")\n                if frecuencia != 44_100:\n                    fallo(f"{rel} usa {frecuencia} Hz; el contrato del mod exige 44100 Hz.")'''
          new_audio = '''                canales = datos_ogg[cabecera + 11]\n                frecuencia = int.from_bytes(datos_ogg[cabecera + 12:cabecera + 16], "little")\n                partes = ruta.relative_to(carpeta).parts\n                es_musica = bool(partes) and partes[0] == "musica"\n                if es_musica:\n                    # Las canciones conservan imagen estereo y pueden venir a 44.1/48 kHz.\n                    # Ambiente, UI y FX siguen bajo el contrato mono 44.1 kHz.\n                    if canales not in (1, 2):\n                        fallo(f"{rel} tiene {canales} canales; musica admite mono o estereo.")\n                    if frecuencia not in (44_100, 48_000):\n                        fallo(f"{rel} usa {frecuencia} Hz; musica admite 44100 o 48000 Hz.")\n                else:\n                    if canales != 1:\n                        fallo(f"{rel} tiene {canales} canales; FX/ambiente exige mono.")\n                    if frecuencia != 44_100:\n                        fallo(f"{rel} usa {frecuencia} Hz; FX/ambiente exige 44100 Hz.")'''
          if old_audio not in text:
              raise SystemExit('No se encontro contrato mono antiguo')
          text = text.replace(old_audio, new_audio, 1)
          p.write_text(text, encoding='utf-8')

          # Los creditos ahora vienen de la pista dominante, no de claves globales.
          for lang in ('es_es.json', 'en_us.json'):
              lp = root / 'src/main/resources/assets/jobsmenu/lang' / lang
              data = json.loads(lp.read_text(encoding='utf-8'))
              data.pop('jobsmenu.credito.titulo', None)
              data.pop('jobsmenu.credito.autor', None)
              lp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Deja el contrato documentado donde corresponde.
          mp = root / 'docs/musica.md'
          m = mp.read_text(encoding='utf-8')
          needle = 'Los tres recursos de música usan `stream: true` en `sounds.json`. El build no descarga canciones ni depende de servicios externos.\n'
          replacement = needle + '\nLas pistas musicales conservan mono/estéreo y 44,1/48 kHz según la fuente autorizada. Los sonidos de interfaz, ambiente y eventos mantienen el contrato mono 44,1 kHz.\n'
          if needle not in m:
              raise SystemExit('No se encontro punto de insercion en docs/musica.md')
          mp.write_text(m.replace(needle, replacement, 1), encoding='utf-8')

          ap = root / 'docs/AUDITORIA_AUDIO_0.25.0.md'
          a = ap.read_text(encoding='utf-8')
          needle = '34. Los PNG 10–17 no se modifican en este pase.\n'
          replacement = needle + '35. Música permite estéreo 44,1/48 kHz sin degradar las fuentes.\n36. UI, ambiente y FX conservan mono 44,1 kHz.\n'
          if needle in a:
              ap.write_text(a.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Santi.pdr"
          git config user.email "santiagopereiraxd029@gmail.com"
          git add -A
          git commit -m "0.25.0: distinguir musica estereo de FX mono"
          git push origin HEAD:arena/01a07700-music-0250
