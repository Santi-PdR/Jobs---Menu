name: Apply Visual Review 029 Temp

on:
  push:
    branches:
      - improve/nombres-fondos-029

permissions:
  contents: write

jobs:
  apply-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/patch029.gz.b64.* | base64 -d | gzip -d > /tmp/patch029.diff
          git apply --check /tmp/patch029.diff
          git apply /tmp/patch029.diff
          rm -f tools/patch029.part00 tools/patch029.gz.b64.*
          rm -f .github/workflows/export-source-temp.yml
          python3 tools/verificar_version.py
          python3 tools/verificar_fondos.py
          python3 tools/verificar.py
          python3 tools/verificar_ui_musica.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "0.29.0: revisar fondos reales y mejorar lectura"
          git push origin HEAD:improve/nombres-fondos-029
