plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = "${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_id}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: "${mapping_channel}", version: "${mapping_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', "${mod_id}"
        }

        server {
            property 'forge.enabledGameTestNamespaces', "${mod_id}"
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }

    // Minecraft no hereda automaticamente es_uy/es_mx/etc. desde es_es: si el
    // jugador selecciona Espanol (Uruguay), las claves propias que no existen
    // en es_uy caen hasta en_us. Jobs usa una traduccion espanola neutral y la
    // duplica solo en la salida para mantener una unica fuente de verdad.
    ['es_ar', 'es_cl', 'es_ec', 'es_mx', 'es_uy', 'es_ve'].each { codigo ->
        from('src/main/resources/assets/jobsmenu/lang/es_es.json') {
            into 'assets/jobsmenu/lang'
            rename { "${codigo}.json" }
        }
    }

    // La musica distribuida ya vive dentro de assets. El build no descarga ni
    // copia material externo desde music/.
}

tasks.named('jar', Jar).configure {
    // Mismos archivos + mismo codigo deben producir un archivo estable. Los
    // timestamps de entradas y del manifest hacian variar el hash sin que el
    // mod hubiese cambiado.
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

// reobfJar abre un proceso Java separado. El tope evita reservas de memoria
// desproporcionadas en equipos con poca RAM/archivo de paginacion.
afterEvaluate {
    tasks.withType(net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace).configureEach {
        it.getJvmArgs().set(['-Xmx384m', '-XX:+UseSerialGC'])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
