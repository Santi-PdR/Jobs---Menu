plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = "${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_id}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: "${mapping_channel}", version: "${mapping_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', "${mod_id}"
        }

        server {
            property 'forge.enabledGameTestNamespaces', "${mod_id}"
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }

    // PISTA PROPIA HORNEADA EN EL JAR
    //
    // El tema del menu que viene de fabrica es la pieza sintetizada
    // (musica/defecto.ogg, generada por tools/sonidos.py y versionada en el
    // repo). Si el owner tiene una pista con permiso -por ejemplo REQUIEM, de
    // Emmy Z, para un server entre amigos con el credito puesto- puede dejarla
    // en 'music/requiem.ogg' en la raiz del repo y ese archivo REEMPLAZA al
    // defecto DENTRO DEL JAR compilado, sin tocar el .ogg versionado ni el
    // codigo. Asi la pista viaja con el mod.
    //
    // El archivo NO se versiona (esta en .gitignore): la obra de un tercero no
    // entra al control de versiones. Se declara como entrada opcional via
    // fileTree para que el build se rehaga si cambia y no falle si no existe.
    def carpetaPista = rootProject.file('music')
    inputs.files(fileTree(dir: carpetaPista, includes: ['requiem.ogg'])).optional()
    doLast {
        def destino = layout.buildDirectory
                .file('resources/main/assets/jobsmenu/sounds/musica/defecto.ogg').get().asFile
        // El marcador dice al mod que la pista horneada es una obra con credito
        // (REQUIEM), no el tema sintetizado. Sin el, el credito de pantalla no
        // se muestra: nunca se atribuye a un autor la pieza generada por el mod.
        def marcador = layout.buildDirectory
                .file('resources/main/assets/jobsmenu/musica_creditada.txt').get().asFile
        def fuente = new File(carpetaPista, 'requiem.ogg')
        if (fuente.exists()) {
            destino.parentFile.mkdirs()
            destino.bytes = fuente.bytes
            marcador.parentFile.mkdirs()
            marcador.text = 'requiem'
            logger.lifecycle('[jobsmenu] REQUIEM horneada en el JAR desde music/requiem.ogg (con credito).')
        } else {
            marcador.delete()
            logger.lifecycle('[jobsmenu] Sin music/requiem.ogg: el JAR usa el tema sintetizado, sin credito.')
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
