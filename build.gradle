plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = "${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_id}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: "${mapping_channel}", version: "${mapping_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', "${mod_id}"
        }

        server {
            property 'forge.enabledGameTestNamespaces', "${mod_id}"
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
    // NOTA SOBRE LA MUSICA
    //
    // La pista del menu es el propio archivo versionado
    // assets/jobsmenu/sounds/musica/defecto.ogg. Desde 0.6.4 es REQUIEM
    // directamente -no se hornea en tiempo de compilacion-, porque el paso de
    // build que la copiaba era fragil y podia no ejecutarse (cache de
    // processResources), y de hecho la pista no llegaba a sonar. Ahora el .ogg
    // que suena ES el que esta en el arbol de recursos, sin magia de Gradle: lo
    // que ves en el repo es lo que entra al JAR. El original de la pista, tal
    // como lo subio el owner, queda archivado en music/ como respaldo.
    //
    // Para cambiar de pista: reemplazar assets/jobsmenu/sounds/musica/defecto.ogg
    // por otro OGG Vorbis. El credito de pantalla lo activa el recurso
    // assets/jobsmenu/musica_creditada.txt (si no debe haber credito -tema
    // propio del mod-, se borra ese archivo).
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// MEMORIA DE LA REOBFUSCACION
//
// reobfJar (ForgeGradle) NO corre dentro del daemon de Gradle: abre un proceso
// Java aparte para la herramienta de reofuscacion, y ese proceso reserva por
// defecto ~1/4 de la RAM fisica del equipo. En una PC con poca RAM o archivo de
// paginacion chico, ese pedido (varios cientos de MB) no se puede comprometer y
// el build muere con 'os::commit_memory ... failed (errno=1455)'. Bajarle el
// heap al daemon no lo arregla, porque el que pide la memoria es este fork.
//
// JarExec -del que hereda reobfJar- expone jvmArgs y se los pasa al proceso. Con
// un tope chico, el mod -que es minusculo- reobfusca de sobra y no vuelve a
// pedir memoria que el sistema no tiene.
tasks.named('reobfJar').configure {
    it.getJvmArgs().set(['-Xmx512m'])
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
