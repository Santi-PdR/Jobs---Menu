plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = "${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_id}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: "${mapping_channel}", version: "${mapping_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', "${mod_id}"
        }

        server {
            property 'forge.enabledGameTestNamespaces', "${mod_id}"
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }

    // Minecraft no hereda automaticamente es_uy/es_mx/etc. desde es_es: si el
    // jugador selecciona Español (Uruguay), las claves propias que no existen
    // en es_uy caen hasta en_us. Eso producia pantallas mitad español y mitad
    // ingles ("Close file", "Notice settings", subtitulos ingleses...).
    //
    // Jobs usa una unica traduccion española neutral. La duplicamos solo en la
    // salida del build para mantener una fuente de verdad y cubrir las variantes
    // oficiales que aparecen en el selector de Minecraft.
    ['es_ar', 'es_cl', 'es_ec', 'es_mx', 'es_uy', 'es_ve'].each { codigo ->
        from('src/main/resources/assets/jobsmenu/lang/es_es.json') {
            into 'assets/jobsmenu/lang'
            rename { "${codigo}.json" }
        }
    }

    // Fondos 18-31 entregados por el usuario. Se versionan como un unico ZIP
    // para conservar los binarios sin conversiones intermedias del conector.
    // processResources los extrae como imagenes normales dentro del JAR.
    inputs.file('assets/backgrounds/niveles18-31.zip')
    from(zipTree(file('assets/backgrounds/niveles18-31.zip'))) {
        into 'assets/jobsmenu/textures/backgrounds'
    }

    // NOTA SOBRE LA MUSICA
    //
    // La pista de fabrica es el archivo original y versionado
    // assets/jobsmenu/sounds/musica/defecto.ogg. No se copia material externo
    // desde music/ durante el build: ese directorio conserva una referencia que
    // requiere permiso antes de redistribuirse.
    //
    // Para una pista propia con licencia: reemplazar el .ogg de recursos por
    // otro OGG Vorbis mono. El credito debe vivir en lang y solo habilitarse
    // cuando la autoria y los derechos de distribucion esten confirmados.
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// MEMORIA DE LA REOBFUSCACION
//
// reobfJar (ForgeGradle) NO corre dentro del daemon de Gradle: abre un proceso
// Java aparte para la herramienta de reofuscacion, y ese proceso reserva por
// defecto ~1/4 de la RAM fisica del equipo. En una PC con poca RAM o archivo de
// paginacion chico, ese pedido (varios cientos de MB) no se puede comprometer y
// el build muere con 'os::commit_memory ... failed (errno=1455)'. Bajarle el
// heap al daemon no lo arregla, porque el que pide la memoria es este fork.
//
// reobfJar es un RenameJarInPlace (hereda de JarExec) y expone getJvmArgs(), que
// se los pasa al proceso. Con un tope chico, el mod -que es minusculo-
// reobfusca de sobra y no vuelve a pedir memoria que el sistema no tiene.
//
// Se configura en afterEvaluate porque ForgeGradle crea las tareas de reobf
// tarde, durante la evaluacion: en el cuerpo del script todavia no existen, y
// tasks.named('reobfJar') fallaria con "Task ... not found". Se recorre por tipo
// para no depender del nombre exacto y no romper si algun dia cambia.
afterEvaluate {
    tasks.withType(net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace).configureEach {
        it.getJvmArgs().set(['-Xmx384m', '-XX:+UseSerialGC'])
    }
}



tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
